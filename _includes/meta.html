    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    {%- if page.excerpt %}
    {%- assign desc = page.excerpt | strip_html | normalize_whitespace | truncate: 160 %}
    {%- else %}
    {%- assign desc = site.bio | default: site.description %}
    {%- endif %}
    <meta name="description" content="{{ desc | escape }}">
    <meta property="og:description" content="{{ desc | escape }}">
    <meta name="author" content="{{ site.name }}">
    <meta property="og:site_name" content="{{ site.name }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ site.avatar | absolute_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    {%- if page.title %}
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta name="twitter:title" content="{{ page.title | escape }}">
    {%- endif %}
