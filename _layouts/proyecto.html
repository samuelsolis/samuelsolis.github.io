---
layout: default
---

<article class="project-page">
  <header class="post-header">
    <p class="project-kind">{{ page.kind }}</p>
    <h1>{{ page.title }}</h1>
  </header>

  <div class="project-body">
    <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | escape }}" class="project-cover{% if page.image_fit == 'contain' %} is-logo{% endif %}">

    <div>
      <div class="entry">
        {{ content }}
      </div>

      {% if page.links %}
      {% if page.links_title %}<h2 class="project-links-title">{{ page.links_title }}</h2>{% endif %}
      <ul class="project-links">
        {% for l in page.links %}
        <li><a href="{{ l.url }}" target="_blank" rel="noopener">{{ l.label }}</a></li>
        {% endfor %}
      </ul>
      {% endif %}

      <a href="{{ '/proyectos/' | relative_url }}" class="back">Ver todos los proyectos</a>
    </div>
  </div>
</article>
