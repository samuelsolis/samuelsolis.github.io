layout: default

<div class="with-intro intro-after">
<article class="post">

    {% include date-es.html date=page.date %}

  <div class="entry">
    {{ content }}

  <a href="{{ site.baseurl }}/" class="back">Volver al blog</a>

{% include intro.html %}
</div>
