<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5Y5SCZMY5X"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5Y5SCZMY5X');
    </script>

    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }}</title>

    {% include meta.html %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ site.baseurl }}/style.css">
    <link rel="alternate" type="application/atom+xml" title="{{ site.name }}" href="{{ site.baseurl }}/feed.xml">
    <link rel="icon" href="{{ site.avatar }}">
  </head>

  <body>
    <header class="site-header">
      <a href="{{ site.baseurl }}/" class="site-name">{{ site.name }}</a>
      <nav class="site-nav" aria-label="Principal">
        {%- for item in site.nav %}{% if item.url %}
        {%- assign external = item.url | slice: 0, 4 %}
        <a href="{% if external == 'http' %}{{ item.url }}{% else %}{{ site.baseurl }}{{ item.url }}{% endif %}"
           {% if item.url == page.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
        {%- endif %}{% endfor %}
      </nav>
    </header>

    <main id="main" class="site-main {{ page.layout }}-layout">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>© {{ site.time | date: "%Y" }} {{ site.name }}</span>
      <span class="footer-links">{% include footer-links.html %}</span>
    </footer>
  </body>
</html>
